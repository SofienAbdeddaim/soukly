<label class="ui-field__label" [for]="controlId()">
  {{ label() }} @if (required()) {
  <span class="ui-field__required" aria-hidden="true">*</span>
  } @else if (optionalLabel()) {
  <span class="ui-field__optional">{{ optionalLabel() }}</span>
  }
</label>
<div class="ui-field__group" [attr.dir]="ltr() ? 'ltr' : null">
  <ng-content select="[uiFieldPrefix]" />
  <ng-content />
  <ng-content select="[uiFieldSuffix]" />
</div>
@if (hint()) {
<p class="ui-field__hint" [id]="hintId()">{{ hint() }}</p>
} @if (invalid()) {
<p class="ui-field__error" [id]="errorId()">
  <svg lucideCircleAlert class="ui-field__error-icon" [size]="16" aria-hidden="true"></svg>
  <span>{{ error() }}</span>
</p>
}
