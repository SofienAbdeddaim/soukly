<app-page-header
  titleId="password-change-title"
  [title]="'account.password-change.title' | transloco"
  back="/account/profile"
  [backLabel]="'account.profile.back' | transloco"
/>

<section class="page" aria-labelledby="password-change-title">
  <p class="page__text">{{ 'account.password-change.other-devices' | transloco }}</p>

  @if (generalError(); as key) {
  <ui-alert type="error" data-testid="password-change-error">{{ key | transloco }}</ui-alert>
  }

  <form class="form" novalidate (submit)="onSubmit($event)" data-testid="password-change-form">
    <fieldset class="form__fields" [disabled]="submitting()">
      <ui-field
        [label]="'account.common.current-password' | transloco"
        [error]="errorKey(form.currentPassword) | transloco"
        controlId="password-change-current"
        required
      >
        <input
          uiControl
          [type]="showCurrent() ? 'text' : 'password'"
          autocomplete="current-password"
          [formField]="form.currentPassword"
        />
        <button
          uiFieldSuffix
          type="button"
          [attr.aria-label]="'account.common.show-password' | transloco"
          [attr.aria-pressed]="showCurrent()"
          (click)="showCurrent.set(!showCurrent())"
        >
          @if (showCurrent()) {
          <svg lucideEyeOff [size]="20" aria-hidden="true"></svg>
          } @else {
          <svg lucideEye [size]="20" aria-hidden="true"></svg>
          }
        </button>
      </ui-field>

      <ui-field
        [label]="'account.reset.new-password' | transloco"
        [hint]="'account.reset.password-hint' | transloco"
        [error]="errorKey(form.newPassword) | transloco"
        controlId="password-change-new"
        required
      >
        <input
          uiControl
          [type]="showNew() ? 'text' : 'password'"
          autocomplete="new-password"
          [formField]="form.newPassword"
        />
        <button
          uiFieldSuffix
          type="button"
          [attr.aria-label]="'account.common.show-password' | transloco"
          [attr.aria-pressed]="showNew()"
          (click)="showNew.set(!showNew())"
        >
          @if (showNew()) {
          <svg lucideEyeOff [size]="20" aria-hidden="true"></svg>
          } @else {
          <svg lucideEye [size]="20" aria-hidden="true"></svg>
          }
        </button>
      </ui-field>

      <button ui-button type="submit" size="lg" [loading]="submitting()">
        {{ 'account.password-change.submit' | transloco }}
      </button>
    </fieldset>
  </form>
</section>
