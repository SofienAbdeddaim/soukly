<app-showcase-section
  [heading]="t().fields"
  panelClass="grid gap-6 rounded-lg bg-surface p-6 shadow-card md:grid-cols-2"
>
  <ui-field [label]="t().titleLabel" [hint]="t().titleHint" required>
    <input uiControl type="text" [placeholder]="t().titlePlaceholder" />
  </ui-field>
  <ui-field [label]="t().priceLabel" [error]="t().priceError" required>
    <input uiControl type="text" inputmode="numeric" value="12,500" dir="ltr" />
  </ui-field>
  <ui-field [label]="t().categoryLabel">
    <select uiControl>
      <option value="">{{ t().categoryChoose }}</option>
      @for (category of t().categories; track category) {
      <option>{{ category }}</option>
      }
    </select>
  </ui-field>
  <ui-field [label]="t().descriptionLabel">
    <textarea uiControl rows="3"></textarea>
  </ui-field>
  <ui-field [label]="t().phoneLabel" [hint]="t().phoneHint" ltr>
    <span uiFieldPrefix aria-hidden="true">+216</span>
    <input uiControl type="tel" inputmode="numeric" value="20 123 456" />
  </ui-field>
  <ui-field [label]="t().amountLabel">
    <input uiControl type="text" inputmode="numeric" dir="ltr" value="32 000" />
    <span uiFieldUnit>{{ t().currency }}</span>
  </ui-field>
  <ui-field [label]="t().passwordLabel">
    <input uiControl [type]="showPassword() ? 'text' : 'password'" value="motdepasse" />
    <button
      uiFieldSuffix
      type="button"
      [attr.aria-label]="t().showPassword"
      [attr.aria-pressed]="showPassword()"
      (click)="showPassword.set(!showPassword())"
    >
      @if (showPassword()) {
      <svg lucideEyeOff [size]="20" aria-hidden="true"></svg>
      } @else {
      <svg lucideEye [size]="20" aria-hidden="true"></svg>
      }
    </button>
  </ui-field>
  <ui-checkbox>
    <input uiCheckboxControl type="checkbox" checked />
    {{ t().termsLabel }}
  </ui-checkbox>
  <ui-checkbox [error]="t().termsError">
    <input uiCheckboxControl type="checkbox" />
    {{ t().termsLabel }}
  </ui-checkbox>
  <ui-switch [checked]="switchOn()" (checkedChange)="switchOn.set($event)">
    {{ t().switchLabel }}
  </ui-switch>
  <ui-switch [disabled]="true">{{ t().switchLabel }}</ui-switch>
</app-showcase-section>
