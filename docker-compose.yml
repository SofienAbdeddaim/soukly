# Local infrastructure for Soukly (SETUP-02).
#   cp .env.example .env
#   docker compose up -d --wait                  # postgres, redpanda, garage, mailpit (+ garage-init)
#   docker compose --profile tools up -d --wait  # adds Redpanda Console and pgAdmin
# Every image is pinned to an exact version published for linux/amd64 and linux/arm64.

name: soukly

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set, copy .env.example to .env}
      USER_SVC_DB_PASSWORD: ${USER_SVC_DB_PASSWORD:?USER_SVC_DB_PASSWORD is not set, copy .env.example to .env}
      LISTING_SVC_DB_PASSWORD: ${LISTING_SVC_DB_PASSWORD:?LISTING_SVC_DB_PASSWORD is not set, copy .env.example to .env}
      SOCIAL_SVC_DB_PASSWORD: ${SOCIAL_SVC_DB_PASSWORD:?SOCIAL_SVC_DB_PASSWORD is not set, copy .env.example to .env}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 images keep their data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    mem_limit: 512m

  redpanda:
    image: redpandadata/redpanda:v26.2.4
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      # Local only: topics are created on first use. Shared environments create them explicitly (DEP-02).
      - --set
      - redpanda.auto_create_topics_enabled=true
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    mem_limit: 1200m

  garage:
    image: dxflrs/garage:v2.4.1
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET is not set, copy .env.example to .env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN is not set, copy .env.example to .env}
    ports:
      - "3900:3900"
      # Website endpoint: public read of the photos under listings/ (ANN-02)
      - "3902:3902"
      - "3903:3903"
    volumes:
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      # The image has no shell: `garage status` exits 0 once the node answers RPC.
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    mem_limit: 256m

  # One-shot: layout, application key, bucket, permissions, CORS and website access. Idempotent.
  garage-init:
    image: amazon/aws-cli:2.38.0
    restart: "no"
    depends_on:
      garage:
        condition: service_healthy
    entrypoint: ["bash", "/init.sh"]
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?GARAGE_ADMIN_TOKEN is not set, copy .env.example to .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is not set, copy .env.example to .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is not set, copy .env.example to .env}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is not set, copy .env.example to .env}
      S3_REGION: ${S3_REGION:?S3_REGION is not set, copy .env.example to .env}
      GARAGE_WEBSITE: "true"
    volumes:
      - ./infra/garage/init.sh:/init.sh:ro

  mailpit:
    image: axllent/mailpit:v1.31.5
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 128m

  redpanda-console:
    image: redpandadata/console:v3.12.0
    profiles: [tools]
    restart: unless-stopped
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/admin/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:9.18.0
    profiles: [tools]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?PGADMIN_DEFAULT_EMAIL is not set, copy .env.example to .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?PGADMIN_DEFAULT_PASSWORD is not set, copy .env.example to .env}
      # IPv4 listener: the default (::) fails where Docker has no IPv6.
      PGADMIN_LISTEN_ADDRESS: 0.0.0.0
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/misc/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  postgres-data:
  redpanda-data:
  garage-data:
  garage-meta:
  pgadmin-data:
