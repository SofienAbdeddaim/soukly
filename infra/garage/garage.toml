# Single-node Garage for local development (SETUP-02).
# rpc_secret and admin token come from the GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN
# environment variables, never from this file.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

replication_factor = 1

rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"

# Website endpoint, for public reads of the photos (ANN-02). The bucket is taken from the Host header:
# http://soukly-listings.web.localhost:3902/listings/<key> (browsers and curl resolve *.localhost to
# the loopback address). garage-init hides incoming/ from it with a routing rule.
[s3_web]
bind_addr = "0.0.0.0:3902"
root_domain = ".web.localhost"

[admin]
api_bind_addr = "0.0.0.0:3903"
