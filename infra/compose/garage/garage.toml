# Single-node Garage of the dev environment on the VM (DEP-02), adapted from the local
# infra/garage/garage.toml (SETUP-02) with the website endpoint for the public photos.
# rpc_secret and admin token come from the GARAGE_RPC_SECRET and GARAGE_ADMIN_TOKEN
# environment variables, never from this file.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

replication_factor = 1

rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"

# Website endpoint: the bucket is taken from the Host header, which the edge Caddy sets to the
# bucket name for photos.<DEV_HOST>.
[s3_web]
bind_addr = "0.0.0.0:3902"
root_domain = ".web.garage.internal"

[admin]
api_bind_addr = "0.0.0.0:3903"
