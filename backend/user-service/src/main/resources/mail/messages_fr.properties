email-change.validity=Ce lien est valable {0} heures et ne fonctionne qu''une seule fois.
email-change.ignore=Si vous n''avez rien demandé, ignorez cet email : aucun compte n''utilisera cette adresse.

email-change-requested.subject=Une demande de changement de votre adresse email Soukly a été faite
