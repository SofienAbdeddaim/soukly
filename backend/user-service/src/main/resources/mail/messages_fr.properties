account-deleted.subject=Votre compte Soukly a été supprimé
account-deleted.intro=Comme vous l''avez demandé, votre compte Soukly a été supprimé. Vous avez été déconnecté de tous vos appareils.
account-deleted.listings=Vos annonces ne sont plus visibles sur Soukly.
