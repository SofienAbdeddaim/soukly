<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout.html :: email(#{email-change-requested.subject}, ~{:: #content})}">
<body>
<div id="content">
  <p style="margin:0 0 16px;" th:text="#{common.greeting(${displayName})}">Hello Amira,</p>
  <p style="margin:0 0 8px;" th:text="#{email-change-requested.intro}">A change of address was asked:</p>
  <p style="margin:0 0 24px;padding:12px 16px;background:#fff8ec;border-radius:8px;font-weight:bold;word-break:break-all;"
     dir="ltr" th:text="${newEmail}">amira.bs@example.tn</p>
  <p style="margin:0 0 16px;" th:text="#{email-change-requested.until}">Until it is confirmed, sign in with this address.</p>
  <p style="margin:0 0 24px;">
    <span th:text="#{email-change-requested.not-you}">Not you?</span>
    <a th:href="${forgotPasswordUrl}" href="#" style="color:#b4441f;font-weight:bold;" th:text="#{email-change-requested.change-password}">Change your password</a>
  </p>
</div>
</body>
</html>
