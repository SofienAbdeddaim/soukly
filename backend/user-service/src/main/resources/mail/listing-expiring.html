<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout.html :: email(#{listing-expiring.subject(${listingTitle})}, ~{:: #content})}">
<body>
<div id="content">
  <p style="margin:0 0 16px;" th:text="#{common.greeting(${displayName})}">Hello Amira,</p>
  <p style="margin:0 0 12px;" th:text="#{listing-expiring.intro(${expiryDate})}">Your listing will be removed on 11 December 2026:</p>
  <!-- The title is the seller's text, in any language: its own direction. Physical border side, since email clients
       do not all support logical properties. -->
  <p style="margin:0 0 24px;padding:12px 16px;background:#fff8ec;font-weight:bold;"
     th:style="'margin:0 0 24px;padding:12px 16px;background:#fff8ec;font-weight:bold;border-' + (${dir} == 'rtl' ? 'right' : 'left') + ':4px solid #f2b33d;'"
     dir="auto" th:text="${listingTitle}">Peugeot 208 Allure</p>
  <p style="margin:0 0 24px;" th:text="#{listing-expiring.renew-hint}">Put it back online in one click.</p>
  <p style="margin:0 0 24px;">
    <a th:href="${listingsUrl}" href="#"
       style="display:inline-block;padding:12px 24px;background:#2a2140;color:#fff8ec;text-decoration:none;border-radius:8px;font-weight:bold;"
       th:text="#{listing-expiring.button}">Put back online</a>
  </p>
  <p style="margin:0 0 4px;color:#6a5f7e;font-size:14px;" th:text="#{common.link-fallback}">Copy this link:</p>
  <p style="margin:0 0 16px;font-size:14px;word-break:break-all;" dir="ltr"><a th:href="${listingsUrl}" th:text="${listingsUrl}" href="#" style="color:#b4441f;">link</a></p>
  <p style="margin:0;color:#6a5f7e;font-size:14px;" th:text="#{listing-expiring.sold}">Sold already? Nothing to do.</p>
</div>
</body>
</html>
