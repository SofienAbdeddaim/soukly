<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout.html :: email(#{password-changed.subject}, ~{:: #content})}">
<body>
<div id="content">
  <p style="margin:0 0 16px;" th:text="#{common.greeting(${displayName})}">Hello Amira,</p>
  <p style="margin:0 0 24px;" th:text="#{password-changed.intro(${changedAt})}">Your password was changed.</p>
  <p style="margin:0 0 16px;" th:text="#{password-changed.devices}">Your other devices were signed out.</p>
  <p style="margin:0 0 24px;">
    <span th:text="#{password-changed.not-you}">Not you?</span>
    <a th:href="${forgotPasswordUrl}" href="#" style="color:#b4441f;font-weight:bold;" th:text="#{password-changed.reset-link}">Reset your password now</a>
  </p>
</div>
</body>
</html>
