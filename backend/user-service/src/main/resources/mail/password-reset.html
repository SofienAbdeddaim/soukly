<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout.html :: email(#{password-reset.subject}, ~{:: #content})}">
<body>
<div id="content">
  <p style="margin:0 0 16px;" th:text="#{common.greeting(${displayName})}">Hello Amira,</p>
  <p style="margin:0 0 24px;" th:text="#{password-reset.intro}">Choose a new password.</p>
  <p style="margin:0 0 24px;">
    <a th:href="${resetUrl}" href="#"
       style="display:inline-block;padding:12px 24px;background:#2a2140;color:#fff8ec;text-decoration:none;border-radius:8px;font-weight:bold;"
       th:text="#{password-reset.button}">Choose a new password</a>
  </p>
  <p style="margin:0 0 16px;" th:text="#{password-reset.validity(${validityMinutes})}">Valid 60 minutes.</p>
  <p style="margin:0 0 4px;color:#6a5f7e;font-size:14px;" th:text="#{common.link-fallback}">Copy this link:</p>
  <p style="margin:0 0 16px;font-size:14px;word-break:break-all;" dir="ltr"><a th:href="${resetUrl}" th:text="${resetUrl}" href="#" style="color:#b4441f;">link</a></p>
  <p style="margin:0;color:#6a5f7e;font-size:14px;" th:text="#{password-reset.ignore}">Ignore this email.</p>
</div>
</body>
</html>
