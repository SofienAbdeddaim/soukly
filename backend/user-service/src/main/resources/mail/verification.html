<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout.html :: email(#{verification.subject}, ~{:: #content})}">
<body>
<div id="content">
  <p style="margin:0 0 16px;" th:text="#{common.greeting(${displayName})}">Hello Amira,</p>
  <p style="margin:0 0 24px;" th:text="#{verification.intro}">Thank you for signing up.</p>
  <p style="margin:0 0 24px;">
    <a th:href="${verifyUrl}" href="#"
       style="display:inline-block;padding:12px 24px;background:#2a2140;color:#fff8ec;text-decoration:none;border-radius:8px;font-weight:bold;"
       th:text="#{verification.button}">Confirm my email</a>
  </p>
  <p style="margin:0 0 16px;" th:text="#{verification.validity(${validityHours})}">Valid 24 hours.</p>
  <p style="margin:0 0 4px;color:#6a5f7e;font-size:14px;" th:text="#{common.link-fallback}">Copy this link:</p>
  <p style="margin:0 0 16px;font-size:14px;word-break:break-all;" dir="ltr"><a th:href="${verifyUrl}" th:text="${verifyUrl}" href="#" style="color:#b4441f;">link</a></p>
  <p style="margin:0;color:#6a5f7e;font-size:14px;" th:text="#{verification.ignore}">Ignore this email.</p>
</div>
</body>
</html>
