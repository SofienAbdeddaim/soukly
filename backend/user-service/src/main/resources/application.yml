server:
  port: ${USER_SERVICE_PORT:8081}

spring:
  application:
    name: user-service
  datasource:
    # Local defaults match docker-compose.yml (SETUP-02); the password comes from SPRING_DATASOURCE_PASSWORD
    # or, when the root .env is sourced, from USER_SVC_DB_PASSWORD.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/soukly_user}
    username: ${SPRING_DATASOURCE_USERNAME:user_svc}
    password: ${SPRING_DATASOURCE_PASSWORD:${USER_SVC_DB_PASSWORD:}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  # Listing events (ANN-03): only listing.expiring-soon is handled, for the reminder email. User events (AUTH-05) are
  # produced by the outbox relay.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    admin:
      # Topics are declared at startup (local and dev); a broker that is down does not prevent the start.
      fail-fast: false
      operation-timeout: 10s
    consumer:
      group-id: user-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      # Dead-letter messages and the user events of the outbox relay (AUTH-05)
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        # A broker that is down must not hold the relay: the events stay in the outbox and leave at a later run.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
  task:
    scheduling:
      pool:
        # Outbox relay, session purge and account purge do not wait for each other
        size: 3
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      # A slow or unreachable SMTP server must not hold the mail threads.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

soukly:
  user:
    # Origin of the front end, used in the links of the emails (never a hard-coded domain)
    front-base-url: ${FRONT_BASE_URL:http://localhost:4200}
    mail-from: ${MAIL_FROM:no-reply@example.com}
    verification-token-ttl: 24h
    verification-resends-per-hour: 3
    # Forgotten password (AUTH-04): validity of a reset link and links an account may receive per hour
    password-reset-token-ttl: ${PASSWORD_RESET_TOKEN_TTL:1h}
    password-resets-per-hour: ${PASSWORD_RESETS_PER_HOUR:3}
    # Profile (AUTH-05): validity of the link that confirms a new address, and changes an account may ask per hour
    email-change-token-ttl: 24h
    email-changes-per-hour: 3
    # A deleted account is erased for good after this; stated in the privacy policy (LEG-01)
    account-purge-after: ${ACCOUNT_PURGE_AFTER:30d}
    account-purge-cron: "0 45 3 * * *"
    # Version of the terms of use recorded at registration (LEG-01): the "version" of frontend/legal/<lang>/terms.md.
    # Change both together (a test of tools/build-legal checks it).
    terms-version: ${LEGAL_TERMS_VERSION:2026-10-22}
    # User events (AUTH-05): outbox relay to soukly.user-events, same behavior as the one of listing-service (ANN-03)
    outbox:
      relay-interval: PT1S
      relay-initial-delay: PT5S
      batch-size: 100
      send-timeout: 15s
      retention: 7d
      purge-interval: PT1H
      partitions: 3
    # Consumer of the listing events (ANN-03): a failed message is retried 3 times, then sent to the DLQ
    listing-events:
      retries: 3
      retry-interval: 2s
    # Service-to-service endpoints /internal/** (CATA-03), never routed by the gateway: callers send this shared
    # token in X-Internal-Token. Empty = every internal request is refused.
    internal-api:
      token: ${INTERNAL_API_TOKEN:}
    # Access tokens (AUTH-02): JWT RS256. The default key path is the one of scripts/gen-jwt-key.sh, seen from
    # backend/user-service (the working directory of spring-boot:run).
    jwt:
      issuer: ${JWT_ISSUER:soukly-user-service}
      key-id: ${JWT_KEY_ID:local}
      private-key-path: ${JWT_PRIVATE_KEY_PATH:../../.secrets/jwt/jwt-private.pem}
      # Key rotation only: public key and kid of the previous pair, still published in the JWKS
      previous-key-id: ${JWT_PREVIOUS_KEY_ID:}
      previous-public-key-path: ${JWT_PREVIOUS_PUBLIC_KEY_PATH:}
      access-token-ttl: ${ACCESS_TOKEN_TTL:15m}
    # Sessions (AUTH-02): opaque refresh token in the soukly_rt cookie, 30 days renewed by every refresh
    session:
      refresh-token-ttl: ${REFRESH_TOKEN_TTL:30d}
      # Path seen by the browser: the gateway removes /api before forwarding
      cookie-path: ${REFRESH_COOKIE_PATH:/api/users}
      cookie-secure: ${REFRESH_COOKIE_SECURE:true}
      # Same exact origins as the CORS of the gateway, comma-separated; never '*'
      allowed-origins: ${ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGINS:http://localhost:4200}}
      purge-retention: 7d
      purge-cron: "0 30 3 * * *"
      throttle:
        free-failures: 5
        first-delay: 30s
        max-delay: 15m
        forget-after: 1d

management:
  health:
    # An SMTP outage must not mark the service down (emails can be resent); see the mail logs instead.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
