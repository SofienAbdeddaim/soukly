server:
  port: ${LISTING_SERVICE_PORT:8082}

spring:
  application:
    name: listing-service
  datasource:
    # Local defaults match docker-compose.yml (SETUP-02); the password comes from SPRING_DATASOURCE_PASSWORD
    # or, when the root .env is sourced, from LISTING_SVC_DB_PASSWORD.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/soukly_listing}
    username: ${SPRING_DATASOURCE_USERNAME:listing_svc}
    password: ${SPRING_DATASOURCE_PASSWORD:${LISTING_SVC_DB_PASSWORD:}}
  flyway:
    locations: classpath:db/migration
  # Listing events (ANN-03): Redpanda through the Kafka API. Only the outbox relay produces.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        # A broker that is down must not hold the relay: the events stay in the outbox and leave at a later run.
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    admin:
      # Topics are declared at startup (local and dev); a broker that is down does not prevent the start.
      fail-fast: false
      operation-timeout: 10s
  task:
    scheduling:
      pool:
        # Outbox relay, expiry task, photo cleanup and listing purge do not wait for each other
        size: 4

management:
  endpoints:
    web:
      exposure:
        include: health

soukly:
  listing:
    jwt:
      # Same values as the gateway (SETUP-06): JWKS of user-service, internal only, and issuer of the access tokens
      jwk-set-uri: ${USER_SERVICE_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:soukly-user-service}
      clock-skew: 30s
    drafts:
      # Drafts per account (ANN-01)
      max-per-owner: 20
    # Publication, expiry and reminder (ANN-03)
    publication:
      ttl: ${LISTING_TTL:60d}
      reminder-before: ${LISTING_REMINDER_BEFORE:3d}
      # Origin of the site, for the page URLs of the events ({lang}/listings/{id})
      public-base-url: ${PUBLIC_BASE_URL:http://localhost:4200}
      check-interval: ${LISTING_CHECK_INTERVAL:PT1H}
      check-initial-delay: PT1M
      batch-size: 100
    # Deletion by the seller (ANN-05): erased for good after purge-after; to confirm with the legal notice (LEG-01)
    deletion:
      purge-after: ${LISTING_PURGE_AFTER:30d}
      purge-interval: P1D
      purge-initial-delay: PT10M
      batch-size: 20
    outbox:
      relay-interval: PT1S
      relay-initial-delay: PT5S
      batch-size: 100
      send-timeout: 15s
      retention: 7d
      purge-interval: PT1H
      partitions: 3
    # Public search (CATA-01)
    search:
      default-limit: 24
      max-limit: 48
      # Lowest trigram word similarity of a title or a brand with a misspelt query
      similarity-threshold: 0.5
      # Signs the pagination cursors; empty = a random key per start (one instance in V1)
      cursor-secret: ${SEARCH_CURSOR_SECRET:}
      cache-max-age: 30s
    # Internal endpoints of user-service (CATA-03): seller profile and phone number, with the shared X-Internal-Token
    user-service:
      base-url: ${USER_SERVICE_URL:http://localhost:8081}
      internal-api-token: ${INTERNAL_API_TOKEN:}
      connect-timeout: 2s
      read-timeout: 3s
      profile-cache-ttl: 5m
    # "Show the number" (CATA-03): distinct listings per member over a sliding window; an assumption of V1
    contact:
      max-listings: ${CONTACT_MAX_LISTINGS_PER_DAY:30}
      window: 24h
    # Local manual tests only: moves the business clock forward (for example P58D to reach the reminder). Never set
    # in dev or prod.
    clock-offset: ${LISTING_CLOCK_OFFSET:PT0S}
    photos:
      # Public URL of the bucket root, the object key is appended (Garage website endpoint locally, ANN-02)
      public-base-url: ${PHOTO_PUBLIC_BASE_URL:http://soukly-listings.web.localhost:3902}
      max-per-listing: 10
      max-size: 5MB
      max-pixels: 50000000
      min-long-side: 400
      min-short-side: 300
      upload-url-ttl: 10m
      pending-ttl: 1h
      cleanup-interval: PT1H
      webp-quality: 80
      conversion-timeout: 30s
      max-concurrent-conversions: 2
    storage:
      # S3 API of the object storage: Garage locally (docker-compose.yml), path-style access
      endpoint: ${S3_ENDPOINT:http://localhost:3900}
      # Host of the presigned upload URLs, as the browsers reach it; the same as S3_ENDPOINT locally
      public-endpoint: ${S3_PUBLIC_ENDPOINT:${S3_ENDPOINT:http://localhost:3900}}
      region: ${S3_REGION:garage}
      bucket: ${S3_BUCKET:soukly-listings}
      # The root .env names them S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY; the deployed stacks pass S3_ACCESS_KEY and
      # S3_SECRET_KEY (infra/compose/compose.yml)
      access-key: ${S3_ACCESS_KEY:${S3_ACCESS_KEY_ID:}}
      secret-key: ${S3_SECRET_KEY:${S3_SECRET_ACCESS_KEY:}}
