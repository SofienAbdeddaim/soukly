server:
  port: ${LISTING_SERVICE_PORT:8082}

spring:
  application:
    name: listing-service
  datasource:
    # Local defaults match docker-compose.yml (SETUP-02); the password comes from SPRING_DATASOURCE_PASSWORD
    # or, when the root .env is sourced, from LISTING_SVC_DB_PASSWORD.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/soukly_listing}
    username: ${SPRING_DATASOURCE_USERNAME:listing_svc}
    password: ${SPRING_DATASOURCE_PASSWORD:${LISTING_SVC_DB_PASSWORD:}}
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

soukly:
  listing:
    jwt:
      # Same values as the gateway (SETUP-06): JWKS of user-service, internal only, and issuer of the access tokens
      jwk-set-uri: ${USER_SERVICE_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:soukly-user-service}
      clock-skew: 30s
    drafts:
      # Drafts per account (ANN-01)
      max-per-owner: 20
    photos:
      # Public URL of the bucket root, the object key is appended (Garage website endpoint locally, ANN-02)
      public-base-url: ${PHOTO_PUBLIC_BASE_URL:http://soukly-listings.web.localhost:3902}
      max-per-listing: 10
      max-size: 5MB
      max-pixels: 50000000
      min-long-side: 400
      min-short-side: 300
      upload-url-ttl: 10m
      pending-ttl: 1h
      cleanup-interval: PT1H
      webp-quality: 80
      conversion-timeout: 30s
      max-concurrent-conversions: 2
    storage:
      # S3 API of the object storage: Garage locally (docker-compose.yml), path-style access
      endpoint: ${S3_ENDPOINT:http://localhost:3900}
      # Host of the presigned upload URLs, as the browsers reach it; the same as S3_ENDPOINT locally
      public-endpoint: ${S3_PUBLIC_ENDPOINT:${S3_ENDPOINT:http://localhost:3900}}
      region: ${S3_REGION:garage}
      bucket: ${S3_BUCKET:soukly-listings}
      # The root .env names them S3_ACCESS_KEY_ID and S3_SECRET_ACCESS_KEY; the deployed stacks pass S3_ACCESS_KEY and
      # S3_SECRET_KEY (infra/compose/compose.yml)
      access-key: ${S3_ACCESS_KEY:${S3_ACCESS_KEY_ID:}}
      secret-key: ${S3_SECRET_KEY:${S3_SECRET_ACCESS_KEY:}}
