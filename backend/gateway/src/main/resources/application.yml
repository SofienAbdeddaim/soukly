server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            # Target service unreachable: 503 after the connect timeout; too slow: 504 after the response timeout
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:10s}
          # The /api prefix is removed before forwarding: /api/listings/42 -> /listings/42 on listing-service.
          # listing-service also serves the referentials (CAT-01): /api/categories/**, /api/locations/**.
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1
            - id: listing-service
              uri: ${LISTING_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/listings/**,/api/categories/**,/api/locations/**
              filters:
                - StripPrefix=1
            - id: social-publisher
              uri: ${SOCIAL_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/social/**
              filters:
                - StripPrefix=1

soukly:
  gateway:
    jwt:
      jwk-set-uri: ${USER_SERVICE_JWKS_URI:${USER_SERVICE_URL:http://localhost:8081}/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:soukly-user-service}
      clock-skew: 30s
    cors:
      # Comma-separated exact origins; never '*'
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
      max-age: 1h
    rate-limit:
      auth-per-minute: ${RATE_LIMIT_AUTH_PER_MINUTE:10}
    # Comma-separated IPs or CIDR ranges of the reverse proxy; empty = X-Forwarded-For is never trusted
    trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:}

management:
  endpoints:
    web:
      # /actuator/health for the container health checks; /api/actuator/info under /api, the only
      # prefix the edge Caddy sends to the gateway, to show the deployed version (DEP-03).
      base-path: /
      path-mapping:
        health: actuator/health
        info: api/actuator/info
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    # Commit SHA of the running images, set by infra/compose/compose.yml.
    version: ${APP_VERSION:unknown}
