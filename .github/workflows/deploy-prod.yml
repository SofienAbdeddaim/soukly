name: deploy-prod

# Puts the last commit of main (or an existing version tag) in prod after Sofien's approval
# (DEP-04): prepare (version and draft notes, read before approving) -> images -> deploy (GitHub
# environment "production", required reviewer) -> release (tag, GitHub release, image tags), only
# when the deployment succeeded. Manual only: never on push, pull_request, schedule or
# workflow_run. The SSH key of the "production" environment can only run
# "/opt/soukly/bin/deploy.sh prod" on the VM, which also backs up the prod databases first.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Part of the version to increase (ignored with redeploy_tag)
        type: choice
        options: [patch, minor, major]
        default: patch
      redeploy_tag:
        description: Existing version to put back in prod (for example v1.3.0); no new tag or notes
        type: string
        default: ''
      allow_untested:
        description: Allow a commit never deployed successfully in dev (urgent fix)
        type: boolean
        default: false

permissions:
  contents: read

# One prod deployment at a time.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      mode: ${{ steps.plan.outputs.mode }}
      flag: ${{ steps.plan.outputs.flag }}
      notes: ${{ steps.plan.outputs.notes }}
      started: ${{ steps.plan.outputs.started }}
    steps:
      - name: Check the branch
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::deploy-prod only runs from main (started from $REF)"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags and history for the version and the notes
          persist-credentials: false
      - id: plan
        env:
          BUMP: ${{ inputs.bump }}
          REDEPLOY_TAG: ${{ inputs.redeploy_tag }}
          ALLOW_UNTESTED: ${{ inputs.allow_untested }}
          MAIN_SHA: ${{ github.sha }}
        run: |
          started=$(date +%s)
          notes_file="$RUNNER_TEMP/notes.md"
          if [ -n "$REDEPLOY_TAG" ]; then
            # Manual rollback: an existing version, no new tag, no notes, no dev check.
            if [[ ! "$REDEPLOY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
              || ! sha=$(git rev-parse --verify --quiet "refs/tags/$REDEPLOY_TAG^{commit}"); then
              echo "::error::Version tag not found: $REDEPLOY_TAG"
              exit 1
            fi
            version="$REDEPLOY_TAG"
            mode=redeploy
            flag=redeploy
            echo "Redeploying $version: no new tag and no release notes." > "$notes_file"
            count="-"
          else
            sha="$MAIN_SHA"
            existing=$(git tag --points-at "$sha" -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            if [ -n "$existing" ]; then
              echo "::error::Already in prod as $existing: use redeploy_tag=$existing"
              exit 1
            fi
            last=$(bash scripts/release/version.sh last)
            version=$(bash scripts/release/version.sh next "$BUMP")
            mode=release
            flag=""
            if [ "$ALLOW_UNTESTED" = true ]; then flag=untested; fi
            bash scripts/release/release-notes.sh "$last" "$sha" "$flag" > "$notes_file"
            if [ -n "$last" ]; then count=$(git rev-list --count "$last..$sha"); else count=$(git rev-list --count "$sha"); fi
          fi
          {
            echo "### deploy-prod: $version"
            echo
            if [ "$flag" = untested ]; then
              echo "> **Not tested in dev**: \`allow_untested\` is set."
              echo
            fi
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | \`$version\`${last:+ (previous: \`$last\`)} |"
            echo "| Commit | \`$sha\` |"
            echo "| Commits since the previous version | $count |"
            echo
            echo "#### Release notes (draft)"
            echo
            cat "$notes_file"
          } >> "$GITHUB_STEP_SUMMARY"
          delimiter="notes_$(openssl rand -hex 16)"
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "mode=$mode"
            echo "flag=$flag"
            echo "started=$started"
            echo "notes<<$delimiter"
            cat "$notes_file"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  images:
    name: images
    needs: prepare
    uses: ./.github/workflows/build-images.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      force: false
    permissions:
      contents: read
      packages: write

  deploy:
    name: deploy
    needs: [prepare, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Required reviewer (Sofien) and deployment branch main: set in the environment's settings.
    environment:
      name: production
      url: https://${{ vars.PROD_HOST }}
    outputs:
      status: ${{ steps.deploy.outputs.status }}
      result: ${{ steps.deploy.outputs.result }}
    steps:
      - id: deploy
        env:
          SHA: ${{ needs.prepare.outputs.sha }}
          FLAG: ${{ needs.prepare.outputs.flag }}
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          KNOWN_HOSTS: ${{ secrets.VM_SSH_KNOWN_HOSTS }}
        run: |
          # Key and pinned host key in files readable by the runner user only, deleted at the end.
          dir="$RUNNER_TEMP/ssh"
          install -d -m 700 "$dir"
          trap 'rm -rf "$dir"' EXIT
          (
            umask 077
            printf '%s\n' "$SSH_KEY" > "$dir/key"
            printf '%s\n' "$KNOWN_HOSTS" > "$dir/known_hosts"
          )
          set +e
          ssh -i "$dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$dir/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            "deploy@$VM_HOST" "$SHA${FLAG:+ $FLAG}" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          status=${PIPESTATUS[0]}
          set -e
          {
            echo "status=$status"
            echo "result=$(sed -n 's/^RESULT: //p' "$RUNNER_TEMP/deploy.log" | tail -n 1)"
          } >> "$GITHUB_OUTPUT"
          exit "$status"

  # Only after a successful deployment of a new version: never on failure, rollback or cancel.
  release:
    name: release
    needs: [prepare, deploy]
    if: ${{ needs.deploy.result == 'success' && needs.prepare.outputs.mode == 'release' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # tag and GitHub release
      packages: write # version tag of the images
    env:
      SHA: ${{ needs.prepare.outputs.sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Create the version tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Soukly $VERSION" "$SHA"
          # Never forced: an existing tag is never rewritten.
          git push origin "refs/tags/$VERSION"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ needs.prepare.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "$VERSION" --verify-tag --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the images with the version
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          for name in gateway user-service listing-service social-publisher frontend; do
            # Same manifests, one more tag: nothing is rebuilt.
            docker buildx imagetools create --tag "$registry/soukly-$name:$VERSION" "$registry/soukly-$name:$SHA"
          done

  summary:
    name: summary
    needs: [prepare, images, deploy, release]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          SHA: ${{ needs.prepare.outputs.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MODE: ${{ needs.prepare.outputs.mode }}
          FLAG: ${{ needs.prepare.outputs.flag }}
          STARTED: ${{ needs.prepare.outputs.started }}
          ACTOR: ${{ github.triggering_actor }}
          IMAGES: ${{ needs.images.result }}
          DEPLOY: ${{ needs.deploy.result }}
          STATUS: ${{ needs.deploy.outputs.status }}
          RESULT: ${{ needs.deploy.outputs.result }}
          RELEASE: ${{ needs.release.result }}
          SERVER: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          git fetch --quiet --tags --force
          # Version tag of a commit, or its short SHA.
          name_of() {
            local tag
            tag=$(git tag --points-at "$1" -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
            echo "${tag:-${1:0:7}}"
          }
          elapsed=$(($(date +%s) - STARTED))
          case "$DEPLOY:$STATUS" in
            success:0)
              if [ "$MODE" = redeploy ]; then
                outcome="redeployed $VERSION"
              elif [ "$RELEASE" = success ]; then
                outcome="released $VERSION ([release]($SERVER/$REPOSITORY/releases/tag/$VERSION))"
              else
                outcome="deployed $VERSION, but the tag or release failed: see the release job"
              fi
              ;;
            failure:2) outcome="failed, rolled back: prod still runs $(name_of "${RESULT#rolled-back }"); no tag, no release" ;;
            skipped:*)
              if [ "$IMAGES" != success ]; then
                outcome="failed, images not built (nothing deployed)"
              else
                outcome="not deployed (approval refused or cancelled); no tag, no release"
              fi
              ;;
            cancelled:*) outcome="cancelled; no tag, no release" ;;
            *) outcome="failed: see the deploy job (refused before any change, or rollback impossible); no tag, no release" ;;
          esac
          {
            echo "### deploy-prod: $outcome"
            echo
            if [ "$FLAG" = untested ]; then
              echo "> **Not tested in dev**: deployed with \`allow_untested\`."
              echo
            fi
            echo "| | |"
            echo "| --- | --- |"
            echo "| Version | \`$VERSION\` ($MODE) |"
            echo "| Commit | \`${SHA:0:7}\` |"
            echo "| Launched by | $ACTOR |"
            echo "| Duration | $((elapsed / 60)) min $((elapsed % 60)) s |"
          } >> "$GITHUB_STEP_SUMMARY"
